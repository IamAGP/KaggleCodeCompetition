[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "name-that-llm"
version = "0.1.0"
description = "Prompt-grouped authorship attribution baseline for Name That LLM"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.6",
  "pyarrow>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6"]
experiments = ["lightgbm>=4.6,<5"]
representations = ["torch==2.13.0", "transformers==5.9.0", "einops==0.8.1",
                   "huggingface-hub==1.16.4", "tokenizers==0.22.2", "safetensors==0.7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
